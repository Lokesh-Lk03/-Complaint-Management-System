<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Student ERP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="theme-light">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="sidebar-brand-text">
                    <h2>UniERP</h2><span>Student Portal</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-label">Main Menu</div>
                <a href="student-dashboard.html"><i class="fa-solid fa-pen-to-square"></i> My Complaints</a>
                <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications
                    <span class="nav-badge" id="sidebarNotifBadge">0</span></a>
                <div class="sidebar-section-label" style="margin-top:10px;">Account</div>
                <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <div class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <div>
                        <div class="header-page-title">Settings</div>
                        <div class="header-breadcrumb">Student <span class="sep">/</span> Settings</div>
                    </div>
                </div>
                <div class="header-right">
                    <a href="notifications.html" class="notif-btn" title="Notifications">
                        <i class="fa-solid fa-bell"></i>
                        <span class="badge" id="headerNotifBadge">0</span>
                    </a>
                    <div class="profile-dropdown">
                        <div class="profile-trigger" id="profileTrigger" onclick="toggleProfileMenu()">
                            <div class="profile-avatar" id="studentAvatar">S</div>
                            <div class="profile-info">
                                <span class="name" id="studentName">Student</span>
                                <span class="role">Student</span>
                            </div>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </div>
                        <div class="profile-menu" id="profileMenu">
                            <div class="profile-menu-header">
                                <div class="full-name" id="menuStudentName">Student</div>
                                <div class="email">student@university.edu</div>
                            </div>
                            <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
                            <hr>
                            <a href="#" class="danger" onclick="logoutUser()"><i
                                    class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="settingsMsg" class="alert hidden" style="margin-bottom:20px;"></div>

                <div class="settings-grid">
                    <!-- Appearance -->
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-palette" style="color:var(--primary);"></i> Appearance</h3>
                        </div>
                        <div class="card-body">
                            <div class="toggle-switch" style="padding:10px 0;">
                                <div class="toggle-info">
                                    <h4>Dark Mode</h4>
                                    <p>Switch to dark theme</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode(this.checked)">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-shield-halved" style="color:var(--primary);"></i> Security</h3>
                        </div>
                        <div class="card-body">
                            <form id="changePasswordForm" novalidate>
                                <div class="form-group">
                                    <label>Current Password</label>
                                    <input type="password" id="currentPassword" placeholder="Current password" required>
                                </div>
                                <div class="form-group">
                                    <label>New Password</label>
                                    <input type="password" id="newPassword" placeholder="New password" required>
                                </div>
                                <div class="form-group">
                                    <label>Confirm Password</label>
                                    <input type="password" id="confirmPassword" placeholder="Confirm new password"
                                        required>
                                </div>
                                <div id="pwError" class="alert alert-error hidden" style="margin-bottom:14px;"></div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-key"></i> Update Password
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
