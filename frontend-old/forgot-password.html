<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — ERP University Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-page">
        <div class="login-bg"></div>
        <div class="login-card">
            <div style="margin-bottom: 20px;">
                <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
            </div>
            <div class="login-logo">
                <div class="login-logo-icon"><i class="fa-solid fa-key"></i></div>
                <h2>Reset Password</h2>
                <p>Enter your registered email to receive reset instructions</p>
            </div>

            <div id="fpSuccess" class="alert alert-success hidden">
                <i class="fa-solid fa-check-circle"></i>
                Password reset link sent! Check your email.
            </div>
            <div id="fpError" class="alert alert-error hidden">
                <i class="fa-solid fa-circle-exclamation"></i>
                Email not found in our system.
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="fpEmail">Email Address</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="fpEmail" placeholder="your@university.edu" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
