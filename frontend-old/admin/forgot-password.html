<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Admin ERP</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-page">
        <div class="login-bg admin-login-bg"></div>
        <div class="login-card admin-login-card">
            <div style="margin-bottom:20px;">
                <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Admin Login</a>
            </div>
            <div class="login-logo">
                <div class="login-logo-icon"
                    style="background:linear-gradient(135deg,#d97706,#b45309);box-shadow:0 8px 20px rgba(245,158,11,0.4);">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your admin email to receive reset instructions</p>
            </div>
            <div id="fpSuccess" class="alert alert-success hidden">
                <i class="fa-solid fa-check-circle"></i> Password reset link sent!
            </div>
            <div id="fpError" class="alert alert-error hidden">
                <i class="fa-solid fa-circle-exclamation"></i> Email not found.
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="fpEmail">Admin Email</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="fpEmail" placeholder="admin@university.edu" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-full btn-lg"
                    style="background:linear-gradient(135deg,#d97706,#b45309);color:white;box-shadow:0 2px 8px rgba(245,158,11,0.35);">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>
            </form>
        </div>
    </div>
    <script src="../script.js"></script>
</body>

</html>
