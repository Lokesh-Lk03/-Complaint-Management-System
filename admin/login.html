<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — ERP University Portal</title>
    <meta name="description" content="University ERP Admin Secure Login">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-page">
        <div class="login-bg admin-login-bg"></div>
        <div class="login-card admin-login-card">
            <div class="login-logo">
                <div class="login-logo-icon"
                    style="background: linear-gradient(135deg, #d97706, #b45309); box-shadow: 0 8px 20px rgba(245,158,11,0.4);">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Admin Portal</h2>
                <p>Secure administrative access</p>
            </div>

            <div id="adminLoginError" class="alert alert-error hidden">
                <i class="fa-solid fa-circle-exclamation"></i>
                Invalid credentials or account is blocked.
            </div>

            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-user-shield"></i>
                        <input type="text" id="adminUsername" placeholder="Admin username" required
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="adminPassword" placeholder="Admin password" required
                            autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('adminPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <button type="submit" id="adminLoginBtn" class="btn btn-full btn-lg"
                        style="background: linear-gradient(135deg, #d97706, #b45309); color: white; box-shadow: 0 2px 8px rgba(245,158,11,0.35);">
                        <i class="fa-solid fa-right-to-bracket"></i> Secure Login
                    </button>
                </div>

                <div class="login-footer">
                    <a href="forgot-password.html" style="color: #d97706;"><i class="fa-solid fa-key"></i> Forgot
                        Password?</a>
                </div>
            </form>

            <div class="login-divider">or</div>
            <a href="../login.html" class="login-admin-link">
                <i class="fa-solid fa-graduation-cap"></i> Student Login
            </a>
        </div>
    </div>
    <script src="../script.js"></script>
</body>

</html>
