<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — ERP University Portal</title>
    <meta name="description" content="University ERP Student Login Portal">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-page">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h2>University ERP</h2>
                <p>Student Portal — Sign in to continue</p>
            </div>

            <div id="loginError" class="alert alert-error hidden">
                <i class="fa-solid fa-circle-exclamation"></i>
                Invalid Student ID or password.
            </div>

            <form id="studentLoginForm" novalidate>
                <div class="form-group">
                    <label for="username">Student ID</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="username" placeholder="e.g. STU2024001" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="login-input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required
                            autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-full btn-lg">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                    </button>
                </div>

                <div class="login-footer">
                    <a href="forgot-password.html"><i class="fa-solid fa-key"></i> Forgot Password?</a>
                </div>
            </form>

            <div class="login-divider">or</div>
            <a href="admin/login.html" class="login-admin-link">
                <i class="fa-solid fa-shield-halved"></i> Admin / Staff Login
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
